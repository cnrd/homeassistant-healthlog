name: HealthLog E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-services:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14'
          enable-cache: true
      - run: uv sync --frozen --group dev
      - name: Real Home Assistant to HealthLog tests
        run: uv run python tools/e2e/run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: healthlog-e2e-results
          path: docs/E2E_RESULTS.json
          if-no-files-found: warn
