[project]
name = "homeassistant-healthlog"
version = "1.0.0"
description = "Durable measurement delivery to self-hosted HealthLog"
requires-python = ">=3.14.2"
license = "MIT"

[dependency-groups]
dev = [
  "pytest-homeassistant-custom-component==0.13.375",
  "pytest-cov==7.1.0",
  "ruff==0.17.4",
  "mypy==2.4.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--strict-markers --cov=custom_components.healthlog --cov-report=term-missing"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = true
files = ["custom_components/healthlog"]
